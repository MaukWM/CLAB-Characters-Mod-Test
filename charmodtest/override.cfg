; Godot reads a single override.cfg at the game root, so every CLAB mod shares this one
; file. Listing Lifters here means installing this mod can't silently unregister it - a
; missing autoload is non-fatal, so the line is harmless when Lifters isn't installed.
[autoload_prepend]
Lifters="*res://lifters/mod_entry.gd"
CharModTest="*res://charmodtest/mod_entry.gd"
